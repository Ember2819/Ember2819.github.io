<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olen Thompson</title>
    <meta name="description" content="Olen Thompson, a 14-year-old developer building operating systems, network tools and things for the web." />
    <meta property="og:title" content="Olen Thompson" />
    <meta property="og:description" content="14-year-old developer building operating systems, network tools and things for the web." />
    <meta property="og:url" content="https://olenthompson.me" />
    <meta name="theme-color" content="#0b0e17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
